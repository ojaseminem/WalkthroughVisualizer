name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          npm ci
          pip install -r tools/modelgen/requirements.txt

      # The scene is generated from source rather than committed as a binary, so
      # a change to plan.py shows up as a reviewable diff instead of an opaque
      # .glb. `content` runs the generator and then the wv-cli pipeline, which
      # turns 648 draw calls and 4 MB of PNG into one file.
      - name: Generate and optimise content
        run: npm run content

      # The pipeline must keep working on art that did not come from our own
      # generator: deep nesting, Z-up, duplicate materials, no tags at all.
      - name: Pipeline handles foreign geometry
        run: |
          node tools/wv-cli/fixtures/make-foreign.mjs /tmp/foreign.glb
          node tools/wv-cli/wv.mjs validate /tmp/foreign.glb
          node tools/wv-cli/wv.mjs build /tmp/foreign.glb -o /tmp/foreign-out

      - name: Build
        run: npm run build

      # Screenshots run at low quality here: a GPU-less runner cannot rasterise a
      # full-size WebGL frame inside Playwright's screenshot timeout. The checks
      # do not depend on viewport size and they gate the build. A failed shot is
      # reported and never fatal.
      - name: Verify
        run: |
          npx playwright install --with-deps chromium
          npm run verify:ci

      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: tools/verify/out
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
