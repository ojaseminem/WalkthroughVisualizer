<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14181A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Template Project | Turtle Game Works</title>
<meta name="description" content="Interactive 3D walkthrough by Turtle Game Works.">
<link rel="icon" href="./brand/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="./brand/favicon.png">
<link rel="stylesheet" href="./src/style.css">
</head>
<body class="booting">
<div id="stage"></div>

<!-- Virtual stick. The touch layer moves it to wherever the thumb landed. -->
<div id="stick" aria-hidden="true"><i></i><b></b></div>

<!-- ---------------------------------------------------------------- Intro -->
<div id="loader" class="overlay" role="status" aria-live="polite">
  <div class="intro">
    <img id="intro-logo" src="./brand/tgw-white.png" alt="" width="132" height="99">
    <p class="studio">Turtle Game Works</p>
    <div class="intro-rule"></div>
    <h1 id="load-title">Template Project</h1>
    <p id="load-sub" class="sub">Tower B &middot; 2 BHK &middot; Pune</p>
    <div class="bar" role="progressbar" aria-label="Loading scene"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar-fill"></div></div>
    <p id="load-status" class="status">Preparing scene&hellip;</p>
  </div>
</div>

<!-- ------------------------------------------------------------- Start -->
<div id="start" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="start-title">
  <div class="intro">
    <img class="mini-logo" src="./brand/tgw-white.png" alt="" width="52" height="39">
    <p class="studio small">Turtle Game Works</p>
    <h1 id="start-title">Walk the building</h1>
    <p class="sub" id="start-hint"></p>
    <button id="start-btn" class="primary">Enter walkthrough</button>
    <button id="tour-start-btn" class="ghost">Take the guided tour</button>
  </div>
</div>

<!-- ---------------------------------------------------------------- HUD -->
<header id="hud-top">
  <!-- Identity sits above the location readout so the top left corner is one
       column instead of two unrelated floaters. -->
  <div class="hud-left">
    <div class="brand panel-chrome">
      <img src="./brand/tgw-white.png" alt="" width="28" height="21">
      <div>
        <p id="proj-name">Template Project</p>
        <p class="studio-line">Turtle Game Works</p>
      </div>
    </div>

    <div id="locus" class="panel-chrome">
      <p class="lbl">You are in</p>
      <p id="locus-zone" aria-live="polite">&ensp;</p>
      <p id="locus-meta" class="mono"></p>
    </div>
  </div>

  <nav id="views" class="panel-chrome" aria-label="View mode"></nav>

  <div class="top-right">
    <div id="stats" class="mono panel-chrome hidden" aria-live="off">
      <span><b id="s-fps">--</b>fps</span>
      <span><b id="s-calls">--</b>calls</span>
      <span><b id="s-tris">--</b>tris</span>
      <span id="s-budget" class="badge ok">ok</span>
    </div>
    <button id="btn-stats" class="icon-btn panel-chrome" title="Performance (P)"
            aria-label="Performance" aria-pressed="false">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 13V8m4 5V4m4 9V6m4 7V2" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div id="crosshair"><span></span></div>
<p id="control-hint" class="hidden" role="status"><b>Hold right mouse button</b> to look around and walk</p>
<div id="hover-label" class="hidden"></div>

<nav id="levels" class="panel-chrome" aria-label="Levels"></nav>

<div id="bottom-left">
  <div id="tod" class="panel-chrome" role="group" aria-label="Time of day"></div>
</div>

<div id="bottom-right">
  <button id="btn-rooms" class="chip" aria-expanded="false" aria-controls="rooms">Rooms</button>
  <button id="btn-tour" class="chip accent" aria-pressed="false">Guided tour</button>
  <button id="btn-help" class="chip icon-only" title="Controls" aria-label="Controls">?</button>
</div>

<!-- ------------------------------------------------------------- Drawers -->
<aside id="rooms" class="drawer hidden" aria-label="Room directory">
  <header><h2>Directory</h2><button class="x icon-btn" data-close="rooms" aria-label="Close directory">&times;</button></header>
  <div id="rooms-list"></div>
</aside>

<aside id="poi" class="drawer hidden" aria-label="Point of interest">
  <header><h2 id="poi-title">&ensp;</h2><button class="x icon-btn" data-close="poi" aria-label="Close panel">&times;</button></header>
  <div class="drawer-body">
    <p id="poi-body"></p>
    <dl id="poi-fields"></dl>
    <p id="poi-zone" class="mono foot"></p>
  </div>
</aside>

<!-- ---------------------------------------------------------------- Tour -->
<div id="tour" class="hidden" aria-label="Guided tour">
  <div class="tour-inner panel-chrome">
    <div class="tour-head">
      <div>
        <p class="mono lbl"><span id="tour-count">1 / 7</span> &middot; Guided tour</p>
        <strong id="tour-stop">&ensp;</strong>
      </div>
      <div class="tour-controls">
        <button id="tour-prev" class="icon-btn" title="Previous stop" aria-label="Previous stop">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M11 3v10L4.5 8zM4 3v10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
        </button>
        <button id="tour-play" class="icon-btn play" title="Pause" aria-label="Pause"></button>
        <button id="tour-next" class="icon-btn" title="Next stop" aria-label="Next stop">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5 3v10l6.5-5zM12 3v10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
        </button>
        <button id="tour-exit" class="chip small">Exit</button>
      </div>
    </div>
    <div id="tour-track" class="tour-track" role="slider" tabindex="0"
         aria-label="Tour progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="tour-fill"></div>
      <div id="tour-ticks"></div>
    </div>
    <div id="tour-chapters" class="tour-chapters"></div>
  </div>
</div>

<div id="toast" class="hidden" role="status" aria-live="polite"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
